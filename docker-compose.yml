services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_URL: sqlite:////data/ufde.db
    volumes:
      - ufde-data:/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API: http://localhost:8000
      NEXT_PUBLIC_WS: ws://localhost:8000/ws/stream
    depends_on:
      - backend

volumes:
  ufde-data: